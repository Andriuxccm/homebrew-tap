# Manual smoke test of an Argon build on clean GitHub Macs before it goes out: downloads the zip, checks the signature,
# notarization and minimum macOS, launches it and makes sure it keeps running (a missing-symbol crash on an older macOS
# shows up here).   gh workflow run smoke-app.yml -R Andriuxccm/homebrew-tap -f url=https://argonmac.com/releases/Argon-<v>.zip
name: smoke-app
on:
  workflow_dispatch:
    inputs:
      url:
        description: Zip URL of the build to test (argonmac.com/releases/Argon-<version>.zip)
        required: true
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      URL: ${{ inputs.url }}
    steps:
      - name: Download and verify
        run: |
          sw_vers
          case "$URL" in https://argonmac.com/releases/Argon-*.zip) ;; *) echo "unexpected url"; exit 1 ;; esac
          curl -fsSL "$URL" -o argon.zip
          ditto -x -k argon.zip app
          APP=app/Argon.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'TeamIdentifier|Authority=Developer ID Application'
          spctl -a -vv -t exec "$APP"
      - name: Launch and keep running
        run: |
          open app/Argon.app
          sleep 40
          log show --last 3m --style compact --predicate 'process == "Argon" AND (messageType == error OR messageType == fault)' 2>/dev/null | tail -25 || true
          log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Symbol not found"' 2>/dev/null | tail -10 || true
          if ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i argon; then
            for f in ~/Library/Logs/DiagnosticReports/*Argon*; do head -80 "$f"; done
            echo "CRASH REPORT FOUND"; exit 1
          fi
          pgrep -x Argon >/dev/null && echo "RUNNING after 40 s" || { echo "NOT RUNNING"; exit 1; }
